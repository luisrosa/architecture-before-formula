name: Freeze v1.0 release artifacts

on:
  push:
    branches: [agent/final-math-release-audit]

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-math-release-audit
          fetch-depth: 0

      - name: Download validated artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: architecture-before-formula-v1.0
          path: .build/freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31337528113

      - name: Verify and freeze artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd .build/freeze
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum -c SHA256SUMS.txt
          ! grep -qE '/home/|/Users/|[A-Za-z]:\\' SHA256SUMS.txt
          cd ../..

          cp .build/freeze/Architecture_Before_the_Formula_v1.0.pdf releases/v1.0/
          cp .build/freeze/Architecture_Before_the_Formula_v1.0_Technical_Supplement.pdf releases/v1.0/
          cp .build/freeze/Architecture_Before_the_Formula_v1.0_Source.zip releases/v1.0/
          cp .build/freeze/SHA256SUMS.txt releases/v1.0/

          (cd releases/v1.0 && sha256sum -c SHA256SUMS.txt)
          rm .github/workflows/freeze-v1.0.yml

      - name: Commit frozen release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A releases/v1.0 .github/workflows/freeze-v1.0.yml
          git diff --cached --stat
          git diff --cached --quiet && { echo "No release changes to commit"; exit 1; }
          git commit -m "Freeze final v1.0 release artifacts"
          git push origin HEAD:agent/final-math-release-audit
