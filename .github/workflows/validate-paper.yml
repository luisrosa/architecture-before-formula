name: Validate paper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install metadata validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install cffconvert==2.0.0 PyYAML

      - name: Validate repository before build
        run: |
          cffconvert --validate
          python scripts/validate_repository.py --mode prebuild

      - name: Retrieve pinned official JMLR style
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/JmlrOrg/jmlr-style-file/f413f638b407af76074813f8f88a82a7a5a81e9d/jmlr2e.sty \
            --output paper/jmlr2e.sty
          grep -q "Document Style .*jmlr" paper/jmlr2e.sty

      - name: Compile current manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Audit LaTeX log
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/main.pdf
          test -s paper/main.log
          if grep -Ei 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning:.*undefined citation|Package natbib Warning: There were undefined citations|There were undefined references' paper/main.log; then
            echo 'LaTeX audit failed: undefined citation/reference.' >&2
            exit 1
          fi

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf zip

      - name: Validate release artifacts
        run: |
          mkdir -p .build/output
          cp paper/main.pdf .build/output/Architecture_Before_the_Formula_v1.6.pdf
          bash scripts/validate_release.sh

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-before-formula-v1.6
          path: .build/artifacts/
          if-no-files-found: error
