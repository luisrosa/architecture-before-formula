name: Validate paper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install metadata validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install cffconvert==2.0.0 PyYAML

      - name: Validate repository before build
        run: |
          cffconvert --validate
          python scripts/validate_repository.py --mode prebuild

      - name: Compile article and supplement
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            supplement.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Audit LaTeX logs
        shell: bash
        run: |
          set -euo pipefail
          for stem in main supplement; do
            test -s "paper/${stem}.pdf"
            test -s "paper/${stem}.log"
            if grep -Ei \
              'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning:.*undefined citation|Package natbib Warning: There were undefined citations|There were undefined references|multiply defined|Overfull \\hbox|Overfull \\vbox' \
              "paper/${stem}.log"; then
              echo "LaTeX audit failed for ${stem}." >&2
              exit 1
            fi
          done

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf zip

      - name: Validate semantic references and release artifacts
        run: |
          python scripts/validate_repository.py --mode postbuild
          bash scripts/validate_release.sh

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-before-formula-v1.0
          path: .build/artifacts/
          if-no-files-found: error
